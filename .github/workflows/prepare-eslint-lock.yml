name: Prepare ESLint v10 Lockfile (temporary)

on:
  push:
    branches:
      - maintenance/eslint-v10-migration

permissions:
  contents: read

jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify supported Node 22 runtime
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 22 || minor < 13) { console.error('Node.js 22.13.0 or newer is required.'); process.exit(1); } console.log('Node.js', process.versions.node);"
      - name: Regenerate package lock using npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: eslint-v10-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
